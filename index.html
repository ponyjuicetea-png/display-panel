<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>幸運轉牌賓果</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">1-100 轉盤</p>
          <h1>幸運轉牌賓果</h1>
        </div>
        <div class="score-strip" aria-live="polite">
          <div>
            <span>完成線數</span>
            <strong id="lineCount">0/5</strong>
          </div>
          <div>
            <span>剩餘號碼</span>
            <strong id="remainingCount">100</strong>
          </div>
        </div>
      </header>

      <main class="game-layout">
        <section class="room-panel" aria-label="連線房間">
          <div class="panel-heading">
            <h2>連線房間</h2>
            <div class="status-pill" id="connectionStatus">連線準備中</div>
          </div>
          <div class="room-form">
            <label>
              玩家名稱
              <input id="playerNameInput" maxlength="12" autocomplete="nickname" />
            </label>
            <label>
              房間號碼
              <input
                id="roomCodeInput"
                maxlength="6"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
              />
            </label>
          </div>
          <div class="room-actions">
            <button id="createRoomButton" type="button">
              <span aria-hidden="true">＋</span>
              <span>建立房間</span>
            </button>
            <button id="joinRoomButton" type="button">
              <span aria-hidden="true">→</span>
              <span>加入房間</span>
            </button>
            <button id="copyRoomButton" type="button">
              <span aria-hidden="true">⧉</span>
              <span>複製連結</span>
            </button>
          </div>
          <div class="active-room">
            <span>目前房號</span>
            <strong id="activeRoomCode">------</strong>
          </div>
          <div class="room-message" id="roomMessage" aria-live="polite">尚未加入房間</div>
        </section>

        <section class="wheel-panel" aria-label="數字轉盤">
          <div class="wheel-stage">
            <canvas
              id="wheelCanvas"
              width="760"
              height="760"
              aria-label="1 到 100 的數字轉盤"
            ></canvas>
            <div class="wheel-pointer" aria-hidden="true"></div>
            <div class="result-badge" aria-live="polite">
              <span>本次</span>
              <strong id="currentNumber">--</strong>
            </div>
          </div>

          <div class="controls">
            <button class="primary-button" id="spinButton" type="button">
              <span aria-hidden="true">↻</span>
              <span>旋轉</span>
            </button>
            <button id="newCardButton" type="button">
              <span aria-hidden="true">▦</span>
              <span>新卡</span>
            </button>
            <button id="resetButton" type="button">
              <span aria-hidden="true">↺</span>
              <span>重開</span>
            </button>
            <button id="soundButton" type="button" title="音效開關">
              <span aria-hidden="true">♪</span>
              <span id="soundButtonLabel">音效開</span>
            </button>
          </div>
        </section>

        <section class="board-panel" aria-label="賓果卡">
          <div class="panel-heading">
            <h2>5×5 數字卡</h2>
            <div class="status-pill" id="statusText">等待旋轉</div>
          </div>
          <div class="board" id="board" aria-live="polite"></div>
          <div class="line-meter" id="lineMeter" aria-label="勝利線數進度">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </section>

        <aside class="history-panel" aria-label="已開號碼">
          <div class="panel-heading">
            <h2>已開號碼</h2>
            <div class="called-count" id="calledCount">0</div>
          </div>
          <div class="called-list" id="calledList" aria-live="polite"></div>
        </aside>

        <aside class="players-panel" aria-label="玩家列表">
          <div class="panel-heading">
            <h2>玩家</h2>
            <div class="called-count" id="playerCount">0</div>
          </div>
          <div class="player-list" id="playerList" aria-live="polite"></div>
        </aside>
      </main>
    </div>

    <div class="award-overlay" id="awardOverlay" hidden>
      <div class="award-panel" role="dialog" aria-modal="true" aria-labelledby="awardTitle">
        <button class="award-close" id="awardCloseButton" type="button" aria-label="關閉">×</button>
        <div class="award-medal" aria-hidden="true">★</div>
        <p class="award-kicker">WINNER</p>
        <h2 id="awardTitle">勝利者</h2>
        <strong id="awardWinnerName">玩家</strong>
        <span id="awardWinnerDetail">完成 5 條線</span>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
